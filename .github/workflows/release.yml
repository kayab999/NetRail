name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend tooling
        run: npm ci

      - name: Version single source of truth
        run: bash scripts/check-versions.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Run tests and lint
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/ -q
          cd src-tauri
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Dependency audits (matrix #10)
        run: |
          # Fails the release on known vulnerabilities (RUSTSEC advisories).
          # Warnings (unmaintained/unsound in the GTK3 stack, e.g. atk/glib)
          # are allowed: they are inherent to the Linux desktop toolchain.
          cd src-tauri
          cargo audit
          cd ..
          npm audit --audit-level=high

      - name: Build headless API binary
        working-directory: src-tauri
        run: cargo build --release --bin netrail-api --no-default-features

      - name: Generate SBOM for bundle (embedded in deb/rpm/AppImage)
        run: bash scripts/generate-sbom.sh src-tauri/sbom/SBOM.txt

      - name: Build Tauri desktop bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's bundled strip chokes on .relr.dyn sections in
          # ubuntu-24.04 system libs ("failed to run linuxdeploy" after deb/rpm
          # succeed — NR-16, run 30771210870). Upstream workaround, see
          # tauri-apps/tauri#14796 / #8929 / #13113. Ships an un-stripped
          # AppImage: larger artifact, functional bundle.
          NO_STRIP: true
        run: npm run build

      - name: Collect release artifacts
        run: |
          mkdir -p dist/release
          cp src-tauri/target/release/netrail-api dist/release/
          find src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/release/ \;
          ls -lh dist/release/
          # AppImage is a required ship artifact (patchelf is installed above)
          test -n "$(find dist/release -maxdepth 1 -name '*.AppImage' -print -quit)" \
            || { echo "ERROR: AppImage missing from release bundle"; exit 1; }
          test -n "$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)" \
            || { echo "ERROR: .deb missing from release bundle"; exit 1; }
          test -x dist/release/netrail-api

      - name: E2E smoke release netrail-api
        run: bash scripts/e2e-api-smoke.sh dist/release/netrail-api

      - name: Generate SBOM + SHA256 checksums
        run: |
          bash scripts/generate-sbom.sh dist/release/SBOM.txt
          # Sanity: the bundled artifact copy must equal the one embedded in
          # the deb/rpm/AppImage (same generator, same inputs).
          cmp dist/release/SBOM.txt src-tauri/sbom/SBOM.txt
          cd dist/release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Verify SBOM is embedded in bundles
        run: |
          DEB="$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          RPM="$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "${DEB}" && dpkg-deb -c "${DEB}" | grep -q 'usr/share/netrail/SBOM.txt' || \
            { echo "ERROR: SBOM.txt missing from .deb"; exit 1; }
          test -n "${RPM}" && rpm -qlp "${RPM}" | grep -q 'usr/share/netrail/SBOM.txt' || \
            { echo "ERROR: SBOM.txt missing from .rpm"; exit 1; }
          echo "SBOM embedded in .deb and .rpm OK"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release checksums (sigstore keyless, matrix #10)
        working-directory: dist/release
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-identity-regexp '^https://github.com/kayab999/NetRail/.github/workflows/release.yml@refs/tags/v' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            SHA256SUMS
          echo "signature verification OK"

      - name: Resolve release notes path
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "docs/RELEASE_${TAG}.md" ]; then
            echo "path=docs/RELEASE_${TAG}.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=docs/RELEASE_v1.0.0.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: NetRail ${{ github.ref_name }} — The Sovereign Search Console
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/release/*
          generate_release_notes: true