name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chaos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf

      - name: Rust chaos tests (SQLITE_BUSY, read-only FS, SIGKILL/SIGINT)
        working-directory: src-tauri
        run: cargo test --test chaos_db --test chaos_process

      - name: Rust audit-rotation chaos test
        working-directory: src-tauri
        run: cargo test --lib audit::tests

      - name: Python chaos tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/test_chaos.py -q

      - name: Build netrail-api + live chaos scenarios
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --bin netrail-api --no-default-features
          bash scripts/chaos/harness.sh live-busy
          bash scripts/chaos/harness.sh live-kill

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        run: npm ci

      - name: Version single source of truth
        run: bash scripts/check-versions.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf

      - name: Rust lint and tests
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Python tests
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests/ -q

      - name: Build netrail-api + E2E API smoke
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --bin netrail-api --no-default-features
          bash scripts/e2e-api-smoke.sh

      - name: Dual-stack parity API smoke
        run: bash scripts/parity-api-smoke.sh

      - name: Differential open-URL parity fuzz (QA-03, seed 20260809)
        run: |
          python3 scripts/fuzz-parity.py --corpus-only
          python3 scripts/fuzz-parity.py --ci \
            --binary src-tauri/target/release/netrail-api

      - name: Dependency audits
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
          python -m pip install -q pip-audit
          python -m pip_audit -r requirements.txt