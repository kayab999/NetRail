services:
  # Default: Python compatibility image. Prefer: `docker compose --profile rust up netrail-rust`.
  netrail:
    build: .
    container_name: netrail
    ports:
      # SECURITY: keep 127.0.0.1 — omitting it exposes the API on your LAN
      - "127.0.0.1:7421:7421"
    volumes:
      - netrail_data:/app/data
    environment:
      NETRAIL_DB_PATH: /app/data/netrail.db
      NETRAIL_DB_KEY: "${NETRAIL_DB_KEY:?Set NETRAIL_DB_KEY in .env — generate with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\"}"
      NETRAIL_AUTO_OPEN: "false"
      NETRAIL_HISTORY_ENCRYPT: "true"
      # Recommended for any Docker deployment (not pure single-user trust):
      #   NETRAIL_API_TOKEN: ${NETRAIL_API_TOKEN:-}
      #   NETRAIL_STRICT_BACKEND_URLS: "1"
      #   NETRAIL_AUDIT_LOG: "1"
      # Note: with a token set, NETRAIL_INJECT_UI_TOKEN (default on) places the
      # token in the unauthenticated / page so the UI can log in — a local reader
      # can fetch it (see SECURITY.md). Same-user malware reads the env anyway.
      SEARXNG_URL: ${SEARXNG_URL:-}
    restart: unless-stopped

  netrail-rust:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: netrail-rust
    profiles: ["rust"]
    ports:
      - "127.0.0.1:7421:7421"
    volumes:
      - netrail_data:/app/data
    environment:
      NETRAIL_DB_PATH: /app/data/netrail.db
      NETRAIL_DB_KEY: ${NETRAIL_DB_KEY:?Set NETRAIL_DB_KEY in .env}
      NETRAIL_STATIC_DIR: /usr/share/netrail/static
      NETRAIL_AUTO_OPEN: "false"
      NETRAIL_HISTORY_ENCRYPT: "true"
      NETRAIL_API_TOKEN: ${NETRAIL_API_TOKEN:-}
      NETRAIL_STRICT_BACKEND_URLS: ${NETRAIL_STRICT_BACKEND_URLS:-0}
      NETRAIL_AUDIT_LOG: ${NETRAIL_AUDIT_LOG:-0}
      SEARXNG_URL: ${SEARXNG_URL:-}
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: netrail-searxng
    profiles:
      - searxng
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng_data:/etc/searxng
    restart: unless-stopped

volumes:
  netrail_data:
  searxng_data: